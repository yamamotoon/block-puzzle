<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1b1e2b" />
    <title>BLOCK JAM</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: #12141c;
        overflow: hidden;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: relative;
        width: 100vw; height: 100vh;
        display: flex; align-items: center; justify-content: center;
      }
      canvas { display: block; touch-action: none; }
      #hud {
        position: fixed; top: env(safe-area-inset-top, 8px); left: 0; right: 0;
        display: flex; align-items: center; gap: 8px; padding: 8px 10px;
        color: #e6e8f0; font-size: 16px; pointer-events: none; z-index: 4;
      }
      #hud .hud-center { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
      #hud #moves-label { font-size: 12px; color: #9aa0b4; }
      .hud-btn {
        pointer-events: auto;
        background: #2a2f42; color: #e6e8f0; border: none;
        width: 42px; height: 42px; border-radius: 10px; font-size: 20px; cursor: pointer;
        display: flex; align-items: center; justify-content: center; flex: none;
      }
      #menu {
        position: fixed; top: calc(env(safe-area-inset-top, 8px) + 54px); left: 10px;
        z-index: 5; display: none; flex-direction: column; gap: 6px;
        background: #1b1e2b; padding: 10px; border-radius: 12px;
        box-shadow: 0 10px 28px rgba(0,0,0,0.45);
      }
      #menu.show { display: flex; }
      #menu button {
        pointer-events: auto; background: #2a2f42; color: #e6e8f0; border: none;
        padding: 11px 16px; border-radius: 10px; font-size: 15px; cursor: pointer;
        text-align: left; min-width: 160px;
      }
      .overlay {
        position: fixed; inset: 0; z-index: 10;
        display: none; align-items: center; justify-content: center;
        background: rgba(10,12,18,0.72); backdrop-filter: blur(3px);
      }
      .overlay.show { display: flex; }
      #overlay .card {
        text-align: center; color: #e6e8f0;
        animation: pop 0.35s cubic-bezier(0.2, 1.4, 0.5, 1);
      }
      @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      #overlay h1 { font-size: 40px; margin-bottom: 8px; }
      #clear-stars { font-size: 44px; letter-spacing: 6px; color: #f0c000; height: 52px; }
      #clear-stars .dim { color: #3a4056; }
      #clear-moves { color: #aab; font-size: 15px; margin-top: 6px; }
      #overlay .actions {
        display: flex; gap: 12px; margin-top: 20px;
      }
      #overlay button {
        background: #30a46c; color: #fff; border: none;
        padding: 12px 28px; border-radius: 12px; font-size: 18px; cursor: pointer;
      }
      #overlay #retry-btn { background: #2a2f42; }
      /* レベル選択 */
      #level-select .ls-card {
        background: #1b1e2b; border-radius: 16px; padding: 18px;
        width: min(92vw, 460px); max-height: 80vh; overflow: auto; color: #e6e8f0;
      }
      .ls-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; font-size: 18px; }
      .ls-head button { background: #2a2f42; color: #e6e8f0; border: none; width: 34px; height: 34px; border-radius: 8px; font-size: 16px; cursor: pointer; }
      #ls-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
      .ls-cell {
        aspect-ratio: 1; border: none; border-radius: 12px; cursor: pointer;
        background: #2a2f42; color: #e6e8f0; font-size: 18px; font-weight: 600;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      }
      .ls-cell.done { background: #26483a; }
      .ls-cell .s { font-size: 11px; color: #f0c000; letter-spacing: 1px; height: 12px; }
    </style>
  </head>
  <body>
    <div id="hud">
      <button id="menu-btn" class="hud-btn" aria-label="メニュー">☰</button>
      <div class="hud-center">
        <span id="level-label">Level 1</span>
        <span id="moves-label">手数: 0</span>
      </div>
      <button id="mute-btn" class="hud-btn" aria-label="消音切替">🔊</button>
    </div>
    <div id="menu">
      <button id="levels-btn">🎯 レベル選択</button>
      <button id="prev-btn">‹ 前のレベル</button>
      <button id="next-lv-btn">次のレベル ›</button>
      <button id="reset-btn">↺ やり直す</button>
      <button id="solve-btn">💡 解答を見る</button>
    </div>
    <div id="app">
      <canvas id="game"></canvas>
    </div>
    <div id="overlay" class="overlay">
      <div class="card">
        <h1>Clear! 🎉</h1>
        <div id="clear-stars"></div>
        <div id="clear-moves"></div>
        <div class="actions">
          <button id="retry-btn">↺ Retry</button>
          <button id="next-btn">Next Level</button>
        </div>
      </div>
    </div>
    <div id="level-select" class="overlay">
      <div class="ls-card">
        <div class="ls-head">
          <span>Level Select</span>
          <button id="ls-close" aria-label="閉じる">✕</button>
        </div>
        <div id="ls-grid"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
