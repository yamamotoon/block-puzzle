<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1b1e2b" />
    <title>Color Block Jam</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: #12141c;
        overflow: hidden;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: relative;
        width: 100vw; height: 100vh;
        display: flex; align-items: center; justify-content: center;
      }
      canvas { display: block; touch-action: none; }
      #hud {
        position: fixed; top: env(safe-area-inset-top, 12px); left: 0; right: 0;
        display: flex; align-items: center; justify-content: center; gap: 16px;
        color: #e6e8f0; font-size: 15px; pointer-events: none; z-index: 2;
      }
      #hud button {
        pointer-events: auto;
        background: #2a2f42; color: #e6e8f0; border: none;
        padding: 6px 14px; border-radius: 999px; font-size: 14px; cursor: pointer;
      }
      #overlay {
        position: fixed; inset: 0; z-index: 3;
        display: none; align-items: center; justify-content: center;
        background: rgba(10,12,18,0.72); backdrop-filter: blur(3px);
      }
      #overlay.show { display: flex; }
      #overlay .card {
        text-align: center; color: #e6e8f0;
      }
      #overlay h1 { font-size: 40px; margin-bottom: 8px; }
      #overlay button {
        margin-top: 20px; background: #30a46c; color: #fff; border: none;
        padding: 12px 28px; border-radius: 12px; font-size: 18px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <span id="level-label">Level 1</span>
      <button id="reset-btn">Reset</button>
    </div>
    <div id="app">
      <canvas id="game"></canvas>
    </div>
    <div id="overlay">
      <div class="card">
        <h1>Clear! 🎉</h1>
        <button id="next-btn">Next Level</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
